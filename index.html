<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Runner — Acompanhar ao vivo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0e0f13;
    --surface: #191b22;
    --border: #2a2d38;
    --text: #eceef4;
    --muted: #9aa0b0;
    --accent: #16a34a;
    --accent-soft: rgba(22, 163, 74, 0.14);
    --warn: #b45309;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    gap: 12px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 1.35rem; }
  .status {
    font-size: 0.9rem;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
  }
  .status.paused { border-color: var(--warn); background: rgba(180, 83, 9, 0.15); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .banner {
    background: rgba(180, 83, 9, 0.15);
    border: 1px solid var(--warn);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.9rem;
    display: none;
  }
  .banner.show { display: block; }
  .banner.party { background: var(--accent-soft); border-color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
  }
  .tile b { display: block; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 0.78rem; }
  #map {
    flex: 1;
    min-height: 260px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  footer { text-align: center; }
  .form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .form.show { display: flex; }
  .form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 1rem;
  }
  .form button {
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    color: #fff;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Aguardando sinal… 🛰️</h1>
  <span class="status" id="status" hidden></span>
</header>
<p class="muted" id="subtitle">Assim que a corrida começar, os dados aparecem aqui sozinhos.</p>
<div class="banner" id="banner"></div>
<div class="form" id="form">
  <label class="muted" for="codeInput">Cole aqui o código ou o convite recebido:</label>
  <input id="codeInput" placeholder="runner-ab12cd34" autocapitalize="none" />
  <button id="goBtn">Acompanhar 👀</button>
</div>
<div class="stats">
  <div class="tile"><b id="dist">—</b><span>km</span></div>
  <div class="tile"><b id="time">—</b><span>tempo</span></div>
  <div class="tile"><b id="pace">—</b><span>ritmo /km</span></div>
</div>
<div id="map"></div>
<footer class="muted">Runner 🏃 · acompanhamento ao vivo</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict'

  function extractCode(text) {
    var m = /runner-[a-z0-9]{6,}/i.exec(text || '')
    return m ? m[0].toLowerCase() : null
  }

  function fmtTime(totalSec) {
    var s = Math.max(0, Math.round(totalSec))
    var h = Math.floor(s / 3600)
    var m = Math.floor((s % 3600) / 60)
    var ss = s % 60
    var mm = (h > 0 && m < 10 ? '0' : '') + m
    return (h > 0 ? h + ':' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss
  }

  var STATUS = {
    running: '🟢 Correndo',
    paused: '⏸️ Pausado',
    finished: '🏁 Finalizou!'
  }

  var $ = function (id) { return document.getElementById(id) }

  var map = L.map('map', { zoomControl: false }).setView([-15.78, -47.93], 4)
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 19
  }).addTo(map)
  var line = L.polyline([], { color: '#16a34a', weight: 4 }).addTo(map)
  var marker = L.circleMarker([0, 0], {
    radius: 9, color: '#ffffff', weight: 3, fillColor: '#16a34a', fillOpacity: 1
  })

  var last = null

  function render() {
    if (!last) return
    $('title').textContent = (last.name || 'Corredor(a)') + ' 🏃'
    var st = $('status')
    st.hidden = false
    st.textContent = STATUS[last.status] || last.status
    st.className = 'status' + (last.status === 'paused' ? ' paused' : '')
    $('dist').textContent = (last.distKm || 0).toFixed(2)
    $('time').textContent = fmtTime(last.elapsed || 0)
    $('pace').textContent = last.paceSec ? fmtTime(last.paceSec) : '—'
    var banner = $('banner')
    var age = Math.round((Date.now() - last.t) / 1000)
    if (last.status === 'finished') {
      banner.className = 'banner party show'
      banner.textContent = '🎉 Corrida concluída! ' + (last.distKm || 0).toFixed(2) +
        ' km em ' + fmtTime(last.elapsed || 0) + '. Mandou bem demais!'
      $('subtitle').textContent = 'Corrida encerrada.'
    } else if (age > 60) {
      banner.className = 'banner show'
      banner.textContent = 'Sem atualização há ' + Math.round(age / 60) +
        ' min — pode ser falta de sinal de internet no trajeto.'
    } else {
      banner.className = 'banner'
      $('subtitle').textContent = 'Atualizado há ' + Math.max(0, age) + 's'
    }
  }

  function connect(code) {
    $('subtitle').textContent = 'Conectado ao código ' + code + '. Aguardando o corredor…'
    var es = new EventSource('https://ntfy.sh/' + encodeURIComponent(code) + '/sse?since=12h')
    es.onmessage = function (e) {
      try {
        var envelope = JSON.parse(e.data)
        if (envelope.event !== 'message' || !envelope.message) return
        var p = JSON.parse(envelope.message)
        if (typeof p.distKm !== 'number' || !p.status) return
        if (p.lat != null && p.lon != null) {
          var ll = [p.lat, p.lon]
          line.addLatLng(ll)
          marker.setLatLng(ll)
          if (!map.hasLayer(marker)) marker.addTo(map)
          map.setView(ll, Math.max(map.getZoom(), 15))
        }
        if (!last || p.t >= last.t) { last = p; render() }
      } catch (err) { /* mensagem estranha no tópico — ignora */ }
    }
    es.onerror = function () {
      $('subtitle').textContent = 'Reconectando…'
    }
    setInterval(render, 1000)
  }

  var code = extractCode(location.hash) || extractCode(location.search)
  if (code) {
    connect(code)
  } else {
    $('form').className = 'form show'
    $('subtitle').textContent = 'Este link não tem código de corrida.'
    $('goBtn').addEventListener('click', function () {
      var c = extractCode($('codeInput').value)
      if (c) { location.hash = '#' + c; location.reload() }
    })
  }
})()
</script>
</body>
</html>
